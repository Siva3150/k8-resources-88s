apiVersion: v1 
kind: Pod 
metadata: 
 name: multi-container 
 labels: 
  project: roboshop 
  environment: dev 
spec: 
 containers:
 - name: nginx 
   image: nginx 
   ports: 
   - containerPort: 80 
 - name: almalinux 
   image: almalinux 
   ports:
   - containerPort:80
   command: ["sleep", "100"]
