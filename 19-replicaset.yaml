apiVersion: apps/v1 
kind: ReplicaSet 
metadata: 
 name: nginx 
 #these are replicaset labels 
 labels: 
  purpose: rs-demo 
  project: roboshop 
spec: 
 replicas: 3 
 selector: 
  #these labels are used to select pods 
  matchLabels: 
   purpose: rs-demo 
   project: roboshop 
 # pod definition
 template: 
  metadata: 
   lables: 
    purpose: rs-demo 
    project: roboshop 
  spec: 
   containers: 
   - name: nginx 
     image: nginx 

 